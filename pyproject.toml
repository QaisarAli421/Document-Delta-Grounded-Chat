[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-delta-chat"
version = "0.1.0"
description = "Document Delta & Grounded Chat System"
requires-python = ">=3.11"
dependencies = [
    "pymupdf==1.23.8",
    "pdfplumber==0.10.4",
    "pytesseract==0.3.10",
    "opencv-python==4.9.0.80",
    "ezdxf==1.1.4",
    "groq==0.4.2",
    "chromadb==0.4.24",
    "sentence-transformers==2.7.0",
    "fastapi==0.110.0",
    "uvicorn==0.27.1",
    "pydantic==2.6.3",
    "pydantic-settings==2.2.1",
    "structlog==24.1.0",
    "prometheus-client==0.20.0",
    "pytest==8.1.0",
    "ruff==0.3.0",
    "jinja2==3.1.3",
    "markdown==3.5.2",
    "scipy==1.12.0",
    "rtree==1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov==4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
