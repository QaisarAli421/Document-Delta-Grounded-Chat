version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-llama-3.1-70b}
    volumes:
      - ./data:/app/data
    command: uvicorn src.chat.api:app --host 0.0.0.0 --port 8000
